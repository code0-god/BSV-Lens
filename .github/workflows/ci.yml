name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: code0-god/AQuA
          ref: 6692a52973fbb487a421b07fc8cd881d0542e964
          path: .build/aqua-fixture
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chrome
      - run: npm run test:browser
      - run: xvfb-run -a npm run test:extension
      - run: xvfb-run -a npm run test:aqua
        env:
          AQUA_WORKSPACE: ${{ github.workspace }}/.build/aqua-fixture
      - run: npm run package
      - run: unzip -t dist/*.vsix
      - run: unzip -t dist/*-repository-*.zip
      - run: cd dist && sha256sum -c SHA256SUMS.txt
      - if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: bsv-lens-${{ github.sha }}
          path: |
            dist/bsv-lens-*.vsix
            dist/bsv-lens-repository-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
